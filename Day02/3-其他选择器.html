<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 后代选择器(包含自带和其他后代) 使用空格隔开 */
        .parent p{
            background-color: lightcyan;
        }
        /* 子代选择器 使用>隔开 只会选取到直接子代 */
        .parent>p{
            color: aquamarine;
            font-size: 20px;
        }
        /* 普遍选择器 去除元素默认样式 */
        *{
            margin: 0;
            padding: 0;
            /* 去除列表标志项 */
            list-style: none;
        }
    </style>
</head>
<body>
    <div class="parent">
        <p>块级元素</p>
        <p>块级元素</p>
        <p>块级元素</p>
        <p>块级元素</p>
        <div>
            <p>后代元素</p>
            <p>后代元素</p>
            <p>后代元素</p>
            <p>后代元素</p>
        </div>
    </div>
    <ul>
        <li>山西</li>
        <li>河南</li>
        <li>广西</li>
    </ul>
</body>
</html>
