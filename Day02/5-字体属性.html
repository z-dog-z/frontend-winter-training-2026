<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            /* 字体颜色 */
            /* 1.关键字 */
            /* color:red; */
            /* 2.使用三原色 */
            /* color:rgb(123, 213, 132); */
            /* 3.rgba 三原色+透明度alpha 0-1之间 0完全透明 1完全不透明 */
            /* color:rgba(200, 155, 173, 1) */
            /* 4.是用十六进制 0-9 a-f(3/4/6位) */
            /* color:#ae3333; */
            /* 设置字体大小 */
            /* font-size: 28px; */
            /* 设置字体加粗 */
            /* font-weight:bold; */
            /*设置是否开启斜体 italic开启斜体 normal正常（默认值）*/
            /* font-style: italic; */
            /* 设置字体类型 写多个：第一个不生效用第二个··· */
            font-family: "楷体","微软雅黑",serif,cursive;
        }
    </style>
</head>
<body>
    <div>我是一个块级元素</div>
    <section>我是一个section元素</section>
</body>
</html>
