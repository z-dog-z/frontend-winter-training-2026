<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 300px;
            background-color: pink;
            /* 设置行高 */
            line-height: 300px;
            text-align: center;
            /* 设置过渡属性名称 */
            transition-property: font-size;
            /* 设置过渡属性持续时长 */
            transition-duration: 2s;
            /* 设置过渡速度曲线 */
            transition-timing-function: linear;
            /* 是上面过渡属性的简称 */
            transition:font-size 2s linear,color 2s linear,background-color 2s linear;
        }
        div:hover{
            font-size: 58px;
            color: red;
            background-color: blue;
        }
        img{
            /* transform形变 包含缩放 旋转 平移 */
            transition: width 2s linear;
        }
        img:hover{
            /* scale为缩放  >1放大  <1缩小 */
            /*transform: scale(1.05);*/
            width: 200px;
        }
    </style>
</head>
<body>
    <div>山西农业大学</div>
    <img height="100px" width="139px" src="../音视频/images/ad10.jpg" alt="">
</body>
</html>
