<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 1.标签选择器 标签名+css规则集 */
        div{
            background-color: rgb(252, 252, 32);
        }
        /* 2.id选择器 #id+css规则集 */
        #second{
            background-color: aquamarine;
        }
        /* 3.类选择器 .类名+css规则集 */
        .same{
            font-size: 28px;
            color:rgba(0, 255, 94, 0.929);
        }
    </style>
</head>
<body>
    <div class="same">块级元素</div>
    <div id="second">块级元素</div>
    <div>块级元素</div>
    <div>块级元素</div>
    <p class="same">段落标签</p>
</body>
</html>
